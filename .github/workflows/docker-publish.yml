name: Build, Push & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  # ── Guard: only run the build job on direct pushes OR merged PRs ────────────
  build-and-push:
    # For pull_request events, only proceed if the PR was actually merged
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx (multi-platform + layer caching support) ────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Log in to Docker Hub ─────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 4. Build & push backend ─────────────────────────────────────────────
      #       Tags: mamba86/busnirikshan:backend
      #             mamba86/busnirikshan:backend-<short-sha>
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/busnirikshan:backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ── 5. Build & push frontend ────────────────────────────────────────────
      #       Tags: mamba86/busnirikshan:frontend
      #             mamba86/busnirikshan:frontend-<short-sha>
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/busnirikshan:frontend
          build-args: |
            VITE_API_URL=https://busnirikshanapi.mauliksharma.org
            VITE_WS_URL=wss://busnirikshanapi.mauliksharma.org
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


  redeploy:
    name: Redeploy via Portainer webhook
    needs: build-and-push
    runs-on: ubuntu-latest
 
    steps:
      - name: Trigger Portainer stack webhook
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}")
 
          echo "Portainer webhook response: $HTTP_STATUS"
 
          if [ "$HTTP_STATUS" -ne 204 ]; then
            echo "Webhook call failed with status $HTTP_STATUS"
            exit 1
          fi
 
          echo "Redeploy triggered successfully."
