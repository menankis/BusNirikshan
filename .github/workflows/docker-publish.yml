name: Build, Push & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  # ── Guard: only run the build job on direct pushes OR merged PRs ────────────
  build-and-push:
    # For pull_request events, only proceed if the PR was actually merged
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx (multi-platform + layer caching support) ────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Log in to Docker Hub ─────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 4. Build & push backend ─────────────────────────────────────────────
      #       Tags: mamba86/busnirikshan:backend
      #             mamba86/busnirikshan:backend-<short-sha>
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/busnirikshan:backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ── 5. Build & push frontend ────────────────────────────────────────────
      #       Tags: mamba86/busnirikshan:frontend
      #             mamba86/busnirikshan:frontend-<short-sha>
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/busnirikshan:frontend
          build-args: |
            VITE_API_URL=https://busnirikshanapi.mauliksharma.org
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Job 2: SSH into server and redeploy via docker compose ──────────────────
  #
  #  One-time setup – add these GitHub secrets:
  #    SSH_HOST             → server IP or hostname
  #    SSH_USER             → SSH login user (e.g. ubuntu, root)
  #    SSH_PRIVATE_KEY      → private key whose public half is in ~/.ssh/authorized_keys
  #    COMPOSE_FILE_PATH    → absolute path to docker-compose.yml on the server
  #                           e.g. /home/ubuntu/busnirikshan/docker-compose.yml
  #
  #  Generate a dedicated deploy key (recommended):
  #    ssh-keygen -t ed25519 -C "github-actions-deploy" -f deploy_key -N ""
  #    cat deploy_key.pub >> ~/.ssh/authorized_keys   # on the server
  #    # paste contents of deploy_key as the SSH_PRIVATE_KEY secret
